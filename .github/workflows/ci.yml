name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.14.14

      - name: ruff check
        run: ruff check functions/ layers/ apps/ marvain_cli/ tests/

      - name: ruff format check
        run: ruff format --check functions/ layers/ apps/ marvain_cli/ tests/

  sam-build:
    name: SAM build (Python 3.12)
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_SAM_CLI_VERSION: "1.147.1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAM CLI
        run: python -m pip install "aws-sam-cli==${AWS_SAM_CLI_VERSION}"

      - name: Validate SAM template
        run: sam validate --template-file template.yaml

      - name: Build SAM application
        run: sam build --template-file template.yaml

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:layers/shared/python
      HTTPS_ENABLED: "false"
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            boto3 \
            fastapi \
            mangum \
            uvicorn \
            jinja2 \
            requests \
            httpx \
            python-multipart \
            python-dateutil \
            daylily-auth-cognito==2.1.5 \
            python-jose[cryptography] \
            jsonschema \
            itsdangerous \
            websockets \
            python-dotenv \
            pyyaml \
            typer \
            click \
            pytest \
            pytest-cov

      - name: Docs contract check
        run: python scripts/verify_docs_contracts.py

      - name: Implementation status check
        run: python scripts/generate_implementation_status.py --check

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
