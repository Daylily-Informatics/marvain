AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Agent Hub (Forge) - authoritative personal agent hub with satellites (SAM)

Parameters:
  StageName:
    Type: String
    Default: dev
  DbName:
    Type: String
    Default: agenthub
  AuroraMinACU:
    Type: Number
    Default: 0.5
  AuroraMaxACU:
    Type: Number
    Default: 2
  PlannerModel:
    Type: String
    Default: gpt-4.1-mini

  MaxSpacesPerAgent:
    Type: String
    Default: "5"

  LiveKitUrl:
    Type: String
    Description: Required LiveKit WebSocket server URL used by the Hub and agent worker.
    AllowedPattern: '^wss://.+'

  OpenAICredentialsSecretArn:
    Type: String
    Description: Required pre-provisioned Secrets Manager ARN containing the OpenAI api_key.
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'

  LiveKitCredentialsSecretArn:
    Type: String
    Description: Required pre-provisioned Secrets Manager ARN containing LiveKit api_key and api_secret.
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'

  AgentWorkerImageUri:
    Type: String
    Description: Required ECR image URI pinned by sha256 digest for the Marvain agent worker.
    AllowedPattern: '^.+\.dkr\.ecr\..+\.amazonaws\.com(?:\.cn)?/.+@sha256:[a-f0-9]{64}$'

  AgentWorkerVersion:
    Type: String
    Description: Required immutable source/release identity embedded in worker health evidence.
    MinLength: 1

  AgentWorkerHubDeviceTokenSecretArn:
    Type: String
    Description: Required Secrets Manager ARN whose JSON device_token field authenticates worker writes to the Hub.
    AllowedPattern: '^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$'

  AgentWorkerDesiredCount:
    Type: Number
    Description: Explicit number of ECS Fargate agent-worker tasks; use 0 only before the Hub device token is provisioned.
    MinValue: 0
    MaxValue: 10

  ApiDeploymentVersion:
    Type: String
    Description: Version string to force API Gateway deployment updates
    Default: "1"

  CognitoDomainPrefix:
    Type: String
    Description: Prefix for Cognito Hosted UI domain (must be globally unique across all AWS accounts). Leave empty to auto-generate.
    Default: ""

  EnableGoogleAuth:
    Type: String
    Description: Enable Google as a Cognito Hosted UI identity provider (requires google-oauth secret to be populated).
    AllowedValues:
      - "true"
      - "false"
    Default: "false"

  GuiCallbackUrls:
    Type: CommaDelimitedList
    Description: Allowed Cognito callback URLs for the (local) GUI OAuth flow
    Default: "http://localhost:8084/auth/callback,https://localhost:8084/auth/callback"

  GuiLogoutUrls:
    Type: CommaDelimitedList
    Description: Allowed Cognito logout URLs for the (local) GUI OAuth flow
    Default: "http://localhost:8084/logged-out,https://localhost:8084/logged-out"

  ArtifactCorsAllowedOrigins:
    Type: CommaDelimitedList
    Description: Explicit browser origins allowed to upload verified artifacts directly to S3.

Conditions:
  IsDeploymentV1: !Equals [!Ref ApiDeploymentVersion, "1"]
  IsDeploymentV2: !Equals [!Ref ApiDeploymentVersion, "2"]
  HasCognitoDomainPrefix: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]
  GoogleAuthEnabled: !Equals [!Ref EnableGoogleAuth, "true"]
  GoogleAuthDisabled: !Equals [!Ref EnableGoogleAuth, "false"]
  AgentWorkerEnabled: !Not [!Equals [!Ref AgentWorkerDesiredCount, 0]]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Tags:
      project: marvain
    Environment:
      Variables:
        STAGE: !Ref StageName

Resources:
  # -----------------------------
  # Networking (minimal VPC for Aurora)
  # -----------------------------
  HubVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HubVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.20.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-priv-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HubVpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-priv-b

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HubVpc

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  HubInternetGateway:
    Type: AWS::EC2::InternetGateway

  HubVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref HubVpc
      InternetGatewayId: !Ref HubInternetGateway

  AgentWorkerPublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HubVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.20.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-agent-worker-a

  AgentWorkerPublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref HubVpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.20.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-agent-worker-b

  AgentWorkerPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref HubVpc

  AgentWorkerInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: HubVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref AgentWorkerPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref HubInternetGateway

  AgentWorkerPublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AgentWorkerPublicSubnetA
      RouteTableId: !Ref AgentWorkerPublicRouteTable

  AgentWorkerPublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AgentWorkerPublicSubnetB
      RouteTableId: !Ref AgentWorkerPublicRouteTable

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} Aurora SG
      VpcId: !Ref HubVpc

  TapdbWriterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} TapDB writer SG
      VpcId: !Ref HubVpc

  AgentWorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} agent worker egress-only SG
      VpcId: !Ref HubVpc
      SecurityGroupEgress:
        - Description: Outbound LiveKit, OpenAI, and Hub traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DbIngressFromTapdbWriter:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref TapdbWriterSecurityGroup

  TapdbWriterEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TapdbWriterSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TapdbWriterSecurityGroup

  AgentWorkerEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TapdbWriterSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref AgentWorkerSecurityGroup

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref HubVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref TapdbWriterSecurityGroup

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for AgentHub Aurora
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  # -----------------------------
  # Secrets
  # -----------------------------
  DbCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/db-credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"agenthub"}'
        GenerateStringKey: password
        ExcludePunctuation: true
        PasswordLength: 32

  AdminApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/admin-api-key
      GenerateSecretString:
        SecretStringTemplate: '{"admin_api_key":""}'
        GenerateStringKey: admin_api_key
        PasswordLength: 40
        ExcludePunctuation: true

  GoogleOAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/google-oauth
      Description: Populate explicitly with Google OAuth credentials as {"client_id":"...","client_secret":"..."} before enabling federation.

  # -----------------------------
  # Aurora PostgreSQL Serverless v2 + Data API
  # -----------------------------
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      DatabaseName: !Ref DbName
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbCredentialsSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbCredentialsSecret}:SecretString:password}}'
      EnableHttpEndpoint: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraMinACU
        MaxCapacity: !Ref AuroraMaxACU

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless

  # -----------------------------
  # S3 buckets
  # -----------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
              - x-amz-checksum-sha256
              - x-amz-meta-sha256
              - x-amz-sdk-checksum-algorithm
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedOrigins: !Ref ArtifactCorsAllowedOrigins
            ExposedHeaders:
              - ETag
              - x-amz-checksum-sha256
              - x-amz-version-id
            MaxAge: 300
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRecognitionArtifacts
            Status: Enabled
            Prefix: recognition/
            ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  AuditBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 3650
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # -----------------------------
  # Queues
  # -----------------------------
  TranscriptQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  ActionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  RecognitionQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  IntegrationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  TapdbWriterDlq:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  TapdbWriterQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TapdbWriterDlq.Arn
        maxReceiveCount: 3

  SemanticOutboxDispatcherInvocationDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # -----------------------------
  # WebSocket connection registry
  # -----------------------------
  WsConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connection_id
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: connection_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: device_id_index
          KeySchema:
            - AttributeName: device_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  WsSubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: topic_key
          AttributeType: S
        - AttributeName: connection_id
          AttributeType: S
      KeySchema:
        - AttributeName: topic_key
          KeyType: HASH
        - AttributeName: connection_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: connection_id_index
          KeySchema:
            - AttributeName: connection_id
              KeyType: HASH
            - AttributeName: topic_key
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -----------------------------
  # Lambda layer
  # -----------------------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-shared
      ContentUri: layers/shared/
      CompatibleRuntimes:
        - python3.12

  # -----------------------------
  # REST API (Hub)
  # -----------------------------
  HubApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-hub-api
      EndpointConfiguration:
        Types:
          - REGIONAL

  HubApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/hub_api/
      Handler: lambda_handler.handler
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          TRANSCRIPT_QUEUE_URL: !Ref TranscriptQueue
          ACTION_QUEUE_URL: !Ref ActionQueue
          RECOGNITION_QUEUE_URL: !Ref RecognitionQueue
          TAPDB_WRITER_QUEUE_URL: !Ref TapdbWriterQueue
          INTEGRATION_QUEUE_URL: !Ref IntegrationQueue
          AUDIT_BUCKET: !Ref AuditBucket
          ARTIFACT_BUCKET: !Ref ArtifactBucket
          ADMIN_SECRET_ARN: !Ref AdminApiKeySecret
          OPENAI_SECRET_ARN: !Ref OpenAICredentialsSecretArn
          LIVEKIT_URL: !Ref LiveKitUrl
          LIVEKIT_SECRET_ARN: !Ref LiveKitCredentialsSecretArn
          # Cognito settings
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_APP_CLIENT_ID: !If [GoogleAuthEnabled, !Ref CognitoUserPoolClientGoogle, !Ref CognitoUserPoolClientNative]
          COGNITO_DOMAIN: !If
            - HasCognitoDomainPrefix
            - !Sub ${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
            - !Sub marvain-${StageName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
          COGNITO_REDIRECT_URI: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/auth/callback
          COGNITO_IDENTITY_PROVIDER: !If [GoogleAuthEnabled, "Google", ""]
          SESSION_SECRET_ARN: !Ref SessionSecret
          STACK_NAME: !Ref AWS::StackName
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
          WS_API_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
          AUTO_APPROVE_POLICY_MODE: "enforce"
          MARVAIN_METRICS_NAMESPACE: "Marvain"
          MAX_SPACES_PER_AGENT: !Ref MaxSpacesPerAgent
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
                - !Ref AdminApiKeySecret
                - !Ref OpenAICredentialsSecretArn
                - !Ref LiveKitCredentialsSecretArn
                - !Ref SessionSecret
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/integrations/*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource:
                - !GetAtt TranscriptQueue.Arn
                - !GetAtt ActionQueue.Arn
                - !GetAtt RecognitionQueue.Arn
                - !GetAtt TapdbWriterQueue.Arn
                - !GetAtt IntegrationQueue.Arn
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
                - logs:DescribeLogStreams
              Resource:
                - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-ToolRunnerFunction*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub ${AuditBucket.Arn}/*
                - !Sub ${ArtifactBucket.Arn}/*
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: "*"

  # Explicit API Gateway integration (replaces Events section to avoid circular dependency)
  HubApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HubApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HubApi}/*/*

  HubApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref HubApi
      ParentId: !GetAtt HubApi.RootResourceId
      PathPart: "{proxy+}"

  HubApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref HubApi
      ResourceId: !Ref HubApiResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HubApiFunction.Arn}/invocations

  # Add CORS support at the resource level
  HubApiCorsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref HubApi
      ResourceId: !Ref HubApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Admin-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Root resource method for /
  HubApiRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref HubApi
      ResourceId: !GetAtt HubApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${HubApiFunction.Arn}/invocations

  # Root resource CORS method
  HubApiRootCorsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref HubApi
      ResourceId: !GetAtt HubApi.RootResourceId
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Admin-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  HubApiDeploymentV1:
    Type: AWS::ApiGateway::Deployment
    Condition: IsDeploymentV1
    DependsOn:
      - HubApiMethod
      - HubApiCorsMethod
      - HubApiRootMethod
      - HubApiRootCorsMethod
    Properties:
      RestApiId: !Ref HubApi
      Description: "Deployment v1"

  HubApiDeploymentV2:
    Type: AWS::ApiGateway::Deployment
    Condition: IsDeploymentV2
    DependsOn:
      - HubApiMethod
      - HubApiCorsMethod
      - HubApiRootMethod
      - HubApiRootCorsMethod
    Properties:
      RestApiId: !Ref HubApi
      Description: "Deployment v2"

  HubApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref HubApi
      DeploymentId: !If [IsDeploymentV2, !Ref HubApiDeploymentV2, !Ref HubApiDeploymentV1]
      StageName: !Ref StageName
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100

  # -----------------------------
  # LiveKit agent worker (ECS Fargate, outbound only)
  # -----------------------------
  AgentWorkerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}-agent-worker
      Tags:
        - Key: project
          Value: marvain
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  AgentWorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadAgentWorkerSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref OpenAICredentialsSecretArn
                  - !Ref LiveKitCredentialsSecretArn
                  - !Ref AgentWorkerHubDeviceTokenSecretArn

  AgentWorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole

  AgentWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/ecs/${AWS::StackName}/agent-worker
      RetentionInDays: 30

  AgentWorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-agent-worker
      Tags:
        - Key: project
          Value: marvain
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt AgentWorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt AgentWorkerTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: agent-worker
          Image: !Ref AgentWorkerImageUri
          Essential: true
          Environment:
            - Name: ENV_FILE
              Value: /dev/null
            - Name: LIVEKIT_URL
              Value: !Ref LiveKitUrl
            - Name: HUB_API_BASE
              Value: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
            - Name: MARVAIN_WORKER_VERSION
              Value: !Ref AgentWorkerVersion
          Secrets:
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub '${OpenAICredentialsSecretArn}:api_key::'
            - Name: LIVEKIT_API_KEY
              ValueFrom: !Sub '${LiveKitCredentialsSecretArn}:api_key::'
            - Name: LIVEKIT_API_SECRET
              ValueFrom: !Sub '${LiveKitCredentialsSecretArn}:api_secret::'
            - Name: HUB_DEVICE_TOKEN
              ValueFrom: !Sub '${AgentWorkerHubDeviceTokenSecretArn}:device_token::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AgentWorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c "import pathlib,sys; sys.exit(0 if b'worker.py' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          StopTimeout: 30

  AgentWorkerService:
    Type: AWS::ECS::Service
    DependsOn:
      - HubApiStage
      - AgentWorkerInternetRoute
    Properties:
      ServiceName: !Sub ${AWS::StackName}-agent-worker
      Cluster: !Ref AgentWorkerCluster
      TaskDefinition: !Ref AgentWorkerTaskDefinition
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: !Ref AgentWorkerDesiredCount
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      Tags:
        - Key: project
          Value: marvain
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref AgentWorkerSecurityGroup
          Subnets:
            - !Ref AgentWorkerPublicSubnetA
            - !Ref AgentWorkerPublicSubnetB

  AgentWorkerRunningTaskAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AgentWorkerEnabled
    Properties:
      AlarmName: !Sub ${AWS::StackName}-agent-worker-running-task
      AlarmDescription: Agent worker running task count is below the explicitly configured desired count.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Dimensions:
        - Name: ClusterName
          Value: !Ref AgentWorkerCluster
        - Name: ServiceName
          Value: !GetAtt AgentWorkerService.Name
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref AgentWorkerDesiredCount
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  # -----------------------------
  # Semantic outbox delivery
  # -----------------------------
  SemanticOutboxDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/semantic_outbox_dispatcher/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          TAPDB_WRITER_QUEUE_URL: !Ref TapdbWriterQueue
          SEMANTIC_OUTBOX_DISPATCHER_ID: !Sub ${AWS::StackName}-semantic-outbox-dispatcher
          SEMANTIC_OUTBOX_BATCH_SIZE: "25"
          SEMANTIC_OUTBOX_LEASE_SECONDS: "120"
          SEMANTIC_OUTBOX_MAX_ATTEMPTS: "5"
          SEMANTIC_OUTBOX_RETRY_SECONDS: "60"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource:
                - !GetAtt AuroraCluster.DBClusterArn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt TapdbWriterQueue.Arn

  SemanticOutboxDispatcherSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Drain committed semantic outbox rows into the TapDB writer queue.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SemanticOutboxDispatcherFunction.Arn
          Id: SemanticOutboxDispatcher
          Input: '{"action":"dispatch"}'
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt SemanticOutboxDispatcherInvocationDlq.Arn

  SemanticOutboxDispatcherSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SemanticOutboxDispatcherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SemanticOutboxDispatcherSchedule.Arn

  SemanticOutboxDispatcherInvocationDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SemanticOutboxDispatcherInvocationDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSemanticOutboxDispatcherSchedule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SemanticOutboxDispatcherInvocationDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt SemanticOutboxDispatcherSchedule.Arn

  SemanticOutboxDispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-semantic-outbox-dispatcher-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SemanticOutboxDispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SemanticOutboxDispatcherDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-semantic-outbox-dispatcher-dlq
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SemanticOutboxDispatcherInvocationDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TapdbWriterDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-tapdb-writer-dlq
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TapdbWriterDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  TapdbWriterQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-tapdb-writer-queue-age
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TapdbWriterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------
  # TapDB writer and planner
  # -----------------------------
  TapdbWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/tapdb_writer/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 1024
      Layers:
        - !Ref SharedLayer
      VpcConfig:
        SecurityGroupIds:
          - !Ref TapdbWriterSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Environment:
        Variables:
          TAPDB_DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          TAPDB_DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          TAPDB_DB_SECRET_ARN: !Ref DbCredentialsSecret
          TAPDB_DB_NAME: !Ref DbName
          MERIDIAN_DOMAIN_CODE: V
          TAPDB_OWNER_REPO: marvain
          MARVAIN_METRICS_NAMESPACE: "Marvain"
      Policies:
        - AWSLambdaBasicExecutionRole
        - VPCAccessPolicy: {}
        - SQSPollerPolicy:
            QueueName: !GetAtt TapdbWriterQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
      Events:
        TapdbWriterQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TapdbWriterQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  PlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/planner/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 1024
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          ACTION_QUEUE_URL: !Ref ActionQueue
          TAPDB_WRITER_QUEUE_URL: !Ref TapdbWriterQueue
          INTEGRATION_QUEUE_URL: !Ref IntegrationQueue
          AUDIT_BUCKET: !Ref AuditBucket
          OPENAI_SECRET_ARN: !Ref OpenAICredentialsSecretArn
          PLANNER_MODEL: !Ref PlannerModel
          STACK_NAME: !Ref AWS::StackName
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
          WS_API_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
          AUTO_APPROVE_POLICY_MODE: "enforce"
          MARVAIN_METRICS_NAMESPACE: "Marvain"
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
                - !Ref OpenAICredentialsSecretArn
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/integrations/*
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt ActionQueue.Arn
                - !GetAtt TapdbWriterQueue.Arn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource:
                - !GetAtt TapdbWriterQueue.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub ${AuditBucket.Arn}/*
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: "*"
      Events:
        TranscriptQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt TranscriptQueue.Arn
            BatchSize: 5
        IntegrationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt IntegrationQueue.Arn
            BatchSize: 5

  # -----------------------------
  # Tool Runner (execution plane)
  # -----------------------------
  ToolRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/tool_runner/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          AUDIT_BUCKET: !Ref AuditBucket
          TAPDB_WRITER_QUEUE_URL: !Ref TapdbWriterQueue
          STACK_NAME: !Ref AWS::StackName
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
          WS_API_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
          DEVICE_RESULT_TIMEOUT_SECONDS: "90"
          MARVAIN_METRICS_NAMESPACE: "Marvain"
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/integrations/*
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub ${AuditBucket.Arn}/*
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: "*"
      Events:
        ActionQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ActionQueue.Arn
            BatchSize: 5

  GmailPollFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/gmail_poll/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          INTEGRATION_QUEUE_URL: !Ref IntegrationQueue
          AUDIT_BUCKET: !Ref AuditBucket
          GMAIL_POLL_MAX_RESULTS: "25"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AWS::StackName}/integrations/*
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource:
                - !GetAtt IntegrationQueue.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub ${AuditBucket.Arn}/*
      Events:
        GmailPollSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)

  ActionTimeoutSweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/action_timeout_sweeper/
      Handler: handler.handler
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
          WS_API_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
          ACTION_TIMEOUT_SWEEPER_BATCH_SIZE: "200"
          MARVAIN_METRICS_NAMESPACE: "Marvain"
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: "*"
      Events:
        SweepSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)

  RetentionSweeperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/retention_sweeper/
      Handler: handler.handler
      Timeout: 60
      MemorySize: 512
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          AUDIT_BUCKET: !Ref AuditBucket
          RETENTION_SWEEPER_BATCH_SIZE: "200"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
                - rds-data:BatchExecuteStatement
                - rds-data:BeginTransaction
                - rds-data:CommitTransaction
                - rds-data:RollbackTransaction
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub ${AuditBucket.Arn}/*
      Events:
        RetentionSweepSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  # -----------------------------
  # WebSocket API (sideband control channel)
  # -----------------------------
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ws_connect/
      Handler: handler.handler
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ws_disconnect/
      Handler: handler.handler
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref DbCredentialsSecret

  WsMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/ws_message/
      Handler: handler.handler
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          WS_TABLE: !Ref WsConnectionsTable
          WS_SUBSCRIPTIONS_TABLE: !Ref WsSubscriptionsTable
          WS_AUTH_TTL_SECONDS: "3600"
          SESSION_SECRET_ARN: !Ref SessionSecret
          DB_RESOURCE_ARN: !GetAtt AuroraCluster.DBClusterArn
          DB_SECRET_ARN: !Ref DbCredentialsSecret
          DB_NAME: !Ref DbName
          ACTION_QUEUE_URL: !Ref ActionQueue
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_APP_CLIENT_ID: !If [GoogleAuthEnabled, !Ref CognitoUserPoolClientGoogle, !Ref CognitoUserPoolClientNative]
          WS_API_ENDPOINT: !Sub https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
          MARVAIN_METRICS_NAMESPACE: "Marvain"
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref WsConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WsSubscriptionsTable
        - Statement:
            - Effect: Allow
              Action:
                - rds-data:ExecuteStatement
              Resource: "*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref DbCredentialsSecret
                - !Ref SessionSecret
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: "*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt ActionQueue.Arn

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations

  WsMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsMessageFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join [ '/', [ 'integrations', !Ref WsConnectIntegration ] ]

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Join [ '/', [ 'integrations', !Ref WsDisconnectIntegration ] ]

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Join [ '/', [ 'integrations', !Ref WsMessageIntegration ] ]

  WsDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WsConnectRoute
      - WsDisconnectRoute
      - WsDefaultRoute
    Properties:
      ApiId: !Ref WsApi

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref StageName
      DeploymentId: !Ref WsDeployment

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*/$connect

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*/$disconnect

  WsDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsMessageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*/$default

  # -----------------------------
  # Cognito User Pool for Authentication
  # -----------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      AutoVerifiedAttributes:
        - email
      # IMPORTANT: UsernameAttributes is immutable. Must match existing pool exactly.
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      # NOTE: Do not specify Schema - it's immutable and the existing pool has the default schema

  CognitoGoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleAuthEnabled
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref CognitoUserPool
      ProviderDetails:
        client_id: !Sub '{{resolve:secretsmanager:${GoogleOAuthSecret}:SecretString:client_id}}'
        client_secret: !Sub '{{resolve:secretsmanager:${GoogleOAuthSecret}:SecretString:client_secret}}'
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        name: name
        username: sub
        given_name: given_name
        family_name: family_name
        picture: picture

  CognitoUserPoolClientNative:
    Type: AWS::Cognito::UserPoolClient
    Condition: GoogleAuthDisabled
    Properties:
      ClientName: !Sub ${AWS::StackName}-app
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - aws.cognito.signin.user.admin
      CallbackURLs: !Ref GuiCallbackUrls
      LogoutURLs: !Ref GuiLogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoUserPoolClientGoogle:
    Type: AWS::Cognito::UserPoolClient
    Condition: GoogleAuthEnabled
    DependsOn:
      - CognitoGoogleIdentityProvider
    Properties:
      ClientName: !Sub ${AWS::StackName}-app
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - aws.cognito.signin.user.admin
      CallbackURLs: !Ref GuiCallbackUrls
      LogoutURLs: !Ref GuiLogoutUrls
      SupportedIdentityProviders:
        - COGNITO
        - Google
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If [HasCognitoDomainPrefix, !Ref CognitoDomainPrefix, !Sub "marvain-${StageName}-${AWS::AccountId}"]
      UserPoolId: !Ref CognitoUserPool

  # Session secret for SessionMiddleware
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}/session-secret
      Description: Secret key for session middleware
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret_key
        PasswordLength: 64
        ExcludeCharacters: '"@/\'

  MarvainObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-observability
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Broadcast Delivery",
                "metrics": [
                  ["Marvain", "BroadcastDelivered"],
                  [".", "BroadcastDropped"]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Device Timeouts",
                "metrics": [
                  ["Marvain", "DeviceTimeout"]
                ],
                "stat": "Sum",
                "period": 300,
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  BroadcastDroppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-broadcast-dropped
      Namespace: Marvain
      MetricName: BroadcastDropped
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DeviceTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-device-timeout
      Namespace: Marvain
      MetricName: DeviceTimeout
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  HubRestApiBase:
    Description: Base URL for Hub REST API
    Value: !Sub https://${HubApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  HubWebSocketUrl:
    Description: WebSocket URL for sideband control channel
    Value: !Sub wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  WsConnectionsTableName:
    Description: DynamoDB table name for WebSocket connections
    Value: !Ref WsConnectionsTable
  WsSubscriptionsTableName:
    Description: DynamoDB table name for topic subscription index
    Value: !Ref WsSubscriptionsTable
  AdminApiKeySecretArn:
    Description: Secrets Manager ARN containing admin API key
    Value: !Ref AdminApiKeySecret
  OpenAISecretArn:
    Description: Secrets Manager ARN containing the configured OpenAI API key
    Value: !Ref OpenAICredentialsSecretArn
  LiveKitSecretArn:
    Description: Secrets Manager ARN containing the configured LiveKit API key and secret
    Value: !Ref LiveKitCredentialsSecretArn
  LiveKitUrl:
    Description: LiveKit server URL for media connections
    Value: !Ref LiveKitUrl
  DbClusterArn:
    Description: Aurora cluster ARN (Data API resourceArn)
    Value: !GetAtt AuroraCluster.DBClusterArn
  DbSecretArn:
    Description: Aurora credentials secret ARN (Data API secretArn)
    Value: !Ref DbCredentialsSecret
  DbName:
    Description: Database name
    Value: !Ref DbName
  ArtifactBucketName:
    Description: Bucket for artifacts
    Value: !Ref ArtifactBucket
  RecognitionQueueUrl:
    Description: SQS queue URL for recognition events (voice.sample / face.snapshot)
    Value: !Ref RecognitionQueue
  TapdbWriterQueueUrl:
    Description: SQS queue URL for TapDB semantic write requests
    Value: !Ref TapdbWriterQueue
  TapdbWriterFunctionName:
    Description: Lambda function name for TapDB semantic writer and template seeding
    Value: !Ref TapdbWriterFunction
  SemanticOutboxDispatcherFunctionName:
    Description: Lambda function that drains the durable semantic outbox into the TapDB writer queue
    Value: !Ref SemanticOutboxDispatcherFunction
  SemanticOutboxDispatcherInvocationDlqUrl:
    Description: Queue URL for failed EventBridge invocations of the semantic outbox dispatcher
    Value: !Ref SemanticOutboxDispatcherInvocationDlq
  IntegrationQueueUrl:
    Description: SQS queue URL for normalized inbound integration events
    Value: !Ref IntegrationQueue
  AuditBucketName:
    Description: Bucket for tamper-evident audit log (Object Lock)
    Value: !Ref AuditBucket
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  CognitoAppClientId:
    Description: Cognito App Client ID
    Value: !If [GoogleAuthEnabled, !Ref CognitoUserPoolClientGoogle, !Ref CognitoUserPoolClientNative]
  CognitoIdentityProvider:
    Description: Optional forced identity provider for Hosted UI authorization (e.g. Google)
    Value: !If [GoogleAuthEnabled, "Google", ""]
  CognitoDomain:
    Description: Cognito Hosted UI domain
    Value: !If
      - HasCognitoDomainPrefix
      - !Sub ${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
      - !Sub marvain-${StageName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  CognitoIdpResponseUrl:
    Description: Cognito redirect URL to configure in the external IdP (Google) OAuth client
    Value: !If
      - HasCognitoDomainPrefix
      - !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
      - !Sub https://marvain-${StageName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
  CognitoLoginUrl:
    Description: Cognito Hosted UI login URL (uses the first GUI callback URL)
    Value: !If
      - HasCognitoDomainPrefix
      - !Sub
          - https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${ClientId}&response_type=code&scope=openid+email+profile&redirect_uri=${RedirectUri}
          - RedirectUri: !Select [0, !Ref GuiCallbackUrls]
            ClientId: !If [GoogleAuthEnabled, !Ref CognitoUserPoolClientGoogle, !Ref CognitoUserPoolClientNative]
      - !Sub
          - https://marvain-${StageName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${ClientId}&response_type=code&scope=openid+email+profile&redirect_uri=${RedirectUri}
          - RedirectUri: !Select [0, !Ref GuiCallbackUrls]
            ClientId: !If [GoogleAuthEnabled, !Ref CognitoUserPoolClientGoogle, !Ref CognitoUserPoolClientNative]
  SessionSecretArn:
    Description: Secrets Manager ARN containing session secret key
    Value: !Ref SessionSecret
  AgentWorkerClusterName:
    Description: ECS cluster running the Marvain LiveKit agent worker.
    Value: !Ref AgentWorkerCluster
  AgentWorkerServiceName:
    Description: ECS service maintaining the explicitly configured agent worker task count.
    Value: !GetAtt AgentWorkerService.Name
  AgentWorkerTaskDefinitionArn:
    Description: Pinned ECS task definition used by the agent worker service.
    Value: !Ref AgentWorkerTaskDefinition
  AgentWorkerLogGroupName:
    Description: CloudWatch Logs group for agent worker stdout and stderr.
    Value: !Ref AgentWorkerLogGroup
  AgentWorkerImageUri:
    Description: ECR image digest deployed for the agent worker.
    Value: !Ref AgentWorkerImageUri
  AgentWorkerVersion:
    Description: Worker release identity emitted in health and session evidence.
    Value: !Ref AgentWorkerVersion
  AgentWorkerHubDeviceTokenSecretArn:
    Description: Secrets Manager ARN supplying the agent worker Hub device token.
    Value: !Ref AgentWorkerHubDeviceTokenSecretArn
  GoogleOAuthSecretArn:
    Description: Secrets Manager ARN containing Google OAuth client_id/client_secret JSON
    Value: !Ref GoogleOAuthSecret
